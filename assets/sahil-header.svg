<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Sahil — AI Automation Engineer</title>
<desc id="desc">A warm illustrated developer desk with Sahil's name and AI Automation Engineer title on the laptop, plus a phone, robot, books, plants, coffee and a cat.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF0D4"/>
    <stop offset="1" stop-color="#FFE0B2"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
    <feOffset dy="4"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="420" rx="22" fill="#FFF8E7"/>
<rect x="0" y="0" width="1200" height="292" fill="url(#sky)"/>

