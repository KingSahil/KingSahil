<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">Sahil's build desk</title>
<desc id="d">A playful animated work desk showing ideas, coding, debugging, Blinky, and remote PC control.</desc>
<style>
.ink{stroke:#151515;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ui{font-family:Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="1200" height="390" rx="24" fill="#FFF8E7"/>
<g opacity=".2"><path d="M0 46H1200M0 84H1200" stroke="#222"/><path d="M40 0V390M80 0V390M1120 0V390M1160 0V390" stroke="#222"/></g>
<g class="ui" font-weight="900" letter-spacing="2" fill="#151515">
<circle cx="40" cy="28" r="5" fill="#FF5F57"/><circle cx="59" cy="28" r="5" fill="#FEBC2E"/><circle cx="78" cy="28" r="5" fill="#28C840"/>
<text x="98" y="33" font-size="12">SAHIL'S BUILD DESK</text>
<text x="600" y="33" text-anchor="middle" font-size="11" fill="#666">THINK · BUILD · BREAK · SHIP</text>
</g>

<!-- idea zone -->
<g transform="translate(55 80)">
<text x="0" y="0" class="ui" font-size="12" letter-spacing="2" fill="#666">THINK + REFUEL</text>
<g transform="translate(8 22) rotate(-4)">
<rect width="170" height="100" rx="8" fill="#F9E900" class="ink"/>
<path d="M145 0L170 25L145 25Z" fill="#FFD900" class="ink"/>
<text x="17" y="30" class="ui" font-size="12" font-weight="900">NEXT SIDE QUEST</text>
<path d="M17 55H142M17 72H120M17 89H88" class="ink" fill="none"/></g>
<g transform="translate(185 118)">
<rect x="0" y="12" width="80" height="62" rx="13" fill="#FFB4A2" class="ink"/>
<path d="M80 27C108 22 108 59 80 55" class="ink" fill="none"/>
<rect x="13" y="27" width="54" height="31" rx="5" fill="#151515"/>
<text x="40" y="46" text-anchor="middle" class="ui" font-size="9" font-weight="900" fill="#FFF8E7">DEBUG</text>
<text x="40" y="57" text-anchor="middle" class="ui" font-size="8" font-weight="900" fill="#FF4D00">JUICE</text>
<path d="M29 5C22 -8 38 -10 31 -23M51 8C44 -5 61 -8 54 -23" stroke="#999" stroke-width="3" fill="none"/></g>
</g>

<!-- laptop -->
<g transform="translate(325 72)">
<text x="275" y="-18" text-anchor="middle" class="ui" font-size="12" font-weight="900" letter-spacing="2" fill="#666">DESIGN + CODE</text>
<rect x="52" y="4" width="452" height="235" rx="20" fill="#1D2430" class="ink"/>
<rect x="74" y="28" width="408" height="187" rx="10" fill="#0B0F14"/>
<circle cx="94" cy="47" r="5" fill="#FF5F57"/><circle cx="111" cy="47" r="5" fill="#FEBC2E"/><circle cx="128" cy="47" r="5" fill="#28C840"/>
<text x="145" y="51" class="mono" font-size="11" fill="#8B949E">blinky / agent</text>
<rect x="91" y="66" width="160" height="123" rx="8" fill="#121924"/>
<text x="106" y="91" class="ui" font-size="11" font-weight="900" fill="#F9E900">SEE</text>
<text x="106" y="111" class="ui" font-size="11" font-weight="900" fill="#B9FBC0">THINK</text>
<text x="106" y="131" class="ui" font-size="11" font-weight="900" fill="#FFB4A2">ACT</text>
<path d="M106 151H220M106 168H205" stroke="#596574" stroke-width="3"/>
<rect x="268" y="66" width="194" height="123" rx="8" fill="#0F141B"/>
<text x="282" y="88" class="mono" font-size="11" fill="#FFB4A2">while (curiosity) {</text>
<text x="296" y="108" class="mono" font-size="11" fill="#B9FBC0">build(idea);</text>
<text x="296" y="128" class="mono" font-size="11" fill="#B9FBC0">break(everything);</text>
<text x="296" y="148" class="mono" font-size="11" fill="#B9FBC0">learn();</text>
<text x="282" y="168" class="mono" font-size="11" fill="#F9E900">ship();</text>
<rect x="328" y="158" width="7" height="14" fill="#F9E900"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<path d="M0 239H554L518 267H36Z" fill="#FFB4A2" class="ink"/><rect x="243" y="245" width="64" height="7" rx="4" fill="#8A95A5"/>
</g>

<!-- right zone -->
<g transform="translate(895 72)">
<text x="0" y="-18" class="ui" font-size="12" font-weight="900" letter-spacing="2" fill="#666">BUILD + TEST</text>
<g transform="translate(0 6) rotate(3)">
<rect width="145" height="100" rx="8" fill="#A0C4FF" class="ink"/>
<text x="15" y="28" class="ui" font-size="12" font-weight="900">TODAY</text>
<text x="15" y="52" class="ui" font-size="14" font-weight="900">MAKE THE</text>
<text x="15" y="73" class="ui" font-size="14" font-weight="900" fill="#FF4D00">WEIRD IDEA</text>
<text x="15" y="91" class="mono" font-size="10" font-weight="900">DO IT ANYWAY.</text></g>

<!-- bot -->
<g transform="translate(34 123)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2s" repeatCount="indefinite"/>
<rect x="10" y="24" width="82" height="76" rx="19" fill="#B9FBC0" class="ink"/>
<rect x="22" y="39" width="58" height="31" rx="10" fill="#151515"/>
<circle cx="40" cy="54" r="5" fill="#FFF8E7"/><circle cx="62" cy="54" r="5" fill="#FFF8E7"/>
<path d="M37 82H67" stroke="#FF4D00" stroke-width="6"/>
<path d="M51 24V10" class="ink" fill="none"/><circle cx="51" cy="5" r="6" fill="#FF4D00" class="ink"/>
<path d="M10 48L0 42M92 48L104 42M28 100L20 116M73 100L81 116" class="ink" fill="none"/>
<text x="51" y="134" text-anchor="middle" class="mono" font-size="10" font-weight="900">BLINKY</text></g></g>

<!-- rotating gear -->
<g transform="translate(168 134)">
<g><animateTransform attributeName="transform" type="rotate" from="0 43 43" to="360 43 43" dur="8s" repeatCount="indefinite"/>
<circle cx="43" cy="43" r="24" fill="#F9E900" class="ink"/>
<path d="M43 8V22M43 64V78M8 43H22M64 43H78M18 18L28 28M58 58L68 68M68 18L58 28M28 58L18 68" stroke="#151515" stroke-width="7" fill="none"/>
<circle cx="43" cy="43" r="10" fill="#FFF8E7" class="ink"/></g></g>

<!-- phone -->
<g transform="translate(174 214) rotate(5)">
<rect width="105" height="150" rx="18" fill="#151515" class="ink"/>
<rect x="11" y="16" width="83" height="111" rx="10" fill="#FFF8E7"/>
<text x="21" y="39" class="mono" font-size="9" font-weight="900" fill="#FF4D00">BLINKY</text>
<circle cx="23" cy="53" r="4" fill="#28C840"/><text x="33" y="56" class="ui" font-size="8" font-weight="900">CONNECTED</text>
<rect x="18" y="70" width="68" height="22" rx="5" fill="#F9E900"/><text x="52" y="84" text-anchor="middle" class="ui" font-size="8" font-weight="900">CONTROL PC</text>
<rect x="18" y="98" width="68" height="22" rx="5" fill="#FF4D00"/><text x="52" y="112" text-anchor="middle" class="ui" font-size="8" font-weight="900" fill="#FFF8E7">SEND TASK →</text>
</g>
<path d="M198 246 C118 226, 94 203, 60 182" fill="none" stroke="#FF4D00" stroke-width="3" stroke-dasharray="7 8"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path>
</g>

<rect x="34" y="323" width="1132" height="25" rx="12" fill="#FF4D00" class="ink"/>
<g class="ui" font-size="12" font-weight="900" letter-spacing="1" fill="#151515"><text x="82" y="369">IDEAS NEED FUEL</text><text x="600" y="369" text-anchor="middle">TURN THOUGHTS INTO SOFTWARE</text><text x="1116" y="369" text-anchor="end">MAKE IT MOVE</text></g>
</svg>