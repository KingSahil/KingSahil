<text x="106" y="98" class="mono" font-size="12" fill="#FFB4A2">while (curiosity) {</text><text x="126" y="121" class="mono" font-size="12" fill="#B9FBC0">  build(idea);</text><text x="126" y="143" class="mono" font-size="12" fill="#B9FBC0">  break(everything);</text><text x="126" y="165" class="mono" font-size="12" fill="#B9FBC0">  learn();</text><text x="106" y="187" class="mono" font-size="12" fill="#FFB4A2">}</text><text x="106" y="210" class="mono" font-size="12" fill="#F9E900">return shipped;</text>
