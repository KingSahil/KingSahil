<g><rect width="156" height="66" rx="12" fill="#F9E900" stroke="#151515" stroke-width="3"/><text x="78" y="40" text-anchor="middle" fill="#151515">💡 IDEA</text></g>
<text x="170" y="41" font-size="24" fill="#151515">→</text>
<g transform="translate(200)"><rect width="156" height="66" rx="12" fill="#B9FBC0" stroke="#151515" stroke-width="3"/><text x="78" y="40" text-anchor="middle">🛠️ BUILD</text></g>
<text x="370" y="41" font-size="24">→</text>
<g transform="translate(400)"><rect width="156" height="66" rx="12" fill="#FFB4A2" stroke="#151515" stroke-width="3"/><text x="78" y="40" text-anchor="middle">💥 BREAK</text></g>
