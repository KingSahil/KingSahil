<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">KiranaKeeper</title><desc id="d">Inventory, orders and udhaar for small shops, plus a WhatsApp ordering bot built on free open-source Baileys, not the paid API. Tech: React · Firebase · Node.js · Baileys · Groq</desc><rect x="0.5" y="0.5" width="559" height="229" rx="14" fill="#0d1117" stroke="#30363d"/><rect x="0" y="0" width="6" height="230" rx="3" fill="#34d399"/><text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#34d399">RETAIL + WHATSAPP COMMERCE</text><text x="30" y="82" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">KiranaKeeper</text><text x="30" y="118" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9">Inventory, orders and udhaar for small shops,</text><text x="30" y="144" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9">plus a WhatsApp ordering bot built on free</text><text x="30" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9">open-source Baileys, not the paid API.</text><line x1="30" y1="190" x2="530" y2="190" stroke="#21262d"/><text x="30" y="214" font-family="'Courier New', monospace" font-size="14" fill="#8b949e">React · Firebase · Node.js · Baileys · Groq</text></svg>